[project]
name = "payments-service"
version = "0.1.0"
description = "Async payment processing microservice (FastAPI + PostgreSQL + RabbitMQ/FastStream)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
